  <title>沿海兜风 — 猫咪的海岸骑行</title>

  <style>
    :root{color-scheme:light;--ink:#173f43;--muted:#507276;--glass:rgba(255,255,249,.88);--line:rgba(28,77,79,.14);--accent:#116b70;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}

    .brand{display:flex;gap:12px;align-items:center}.brand-icon{width:42px;height:42px;border:1px solid rgba(23,63,67,.2);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,245,.42)}.brand-icon svg{width:25px;height:25px}.brand-label{font-size:14px;letter-spacing:.14em;font-weight:600}.brand-label span{display:block;font-size:12px;letter-spacing:.24em;margin-top:5px;color:#4e7174}
    .badge{font-size:13px;display:flex;align-items:center;gap:9px;background:rgba(255,255,249,.58);border:1px solid rgba(255,255,255,.6);border-radius:99px;padding:10px 15px;color:#345f65}
    .badge svg{width:17px;height:17px}.intro{position:absolute;top:116px;left:38px;pointer-events:none;z-index:2}.eyebrow{font-size:12px;letter-spacing:.22em;color:#446a6b;margin:0 0 12px;text-transform:uppercase}h1{margin:0;font-size:clamp(30px,3.3vw,48px);font-weight:600;letter-spacing:.04em;line-height:1.2}.intro p:last-child{font-size:14px;letter-spacing:.035em;color:#4b7072;margin:14px 0 0;line-height:1.7}
    .hint{position:absolute;bottom:142px;left:50%;transform:translateX(-50%);color:#31575a;font-size:13px;white-space:nowrap;display:flex;gap:9px;align-items:center;pointer-events:none;opacity:.8}.hint svg{width:17px;height:17px}

    .play{width:52px;height:52px;flex-shrink:0;border:0;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;transition:background .2s,transform .2s}.play:hover{background:#0b5258;transform:scale(1.04)}.play svg{width:20px;height:20px}.pause-icon{display:block}.resume-icon{display:none}.play[data-paused="true"] .pause-icon{display:none}.play[data-paused="true"] .resume-icon{display:block}
    .divider{width:1px;height:36px;background:var(--line);flex-shrink:0}.speed{width:152px;flex-shrink:0}.speed-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}.speed-label output{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}input[type=range]{width:100%;margin:0;height:18px;accent-color:var(--accent);cursor:pointer}
    .views{display:flex;gap:4px;flex-shrink:0}.chip{border:0;background:transparent;color:#527075;border-radius:13px;padding:12px 15px;font-size:14px;white-space:nowrap;transition:background .2s,color .2s}.chip:hover{background:rgba(25,105,110,.07)}.chip[aria-pressed="true"]{background:#deeddf;color:#245b56;font-weight:600}
    .icon-button{border:1px solid var(--line);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:transparent;color:var(--ink);flex-shrink:0;position:relative}.icon-button:hover{background:rgba(25,105,110,.08)}.icon-button svg{width:20px;height:20px}.icon-button span{pointer-events:none;position:absolute;bottom:52px;background:#173f43;color:#fff;white-space:nowrap;padding:7px 11px;font-size:12px;border-radius:8px;opacity:0;transition:opacity .15s}.icon-button:hover span,.icon-button:focus-visible span{opacity:1}
    .journey{position:absolute;bottom:38px;left:38px;font-size:12px;color:#375d5e;letter-spacing:.04em;line-height:1.8;pointer-events:none}.journey strong{font-weight:600;font-size:14px;color:#234c4d;display:block;font-variant-numeric:tabular-nums}.corner{position:absolute;bottom:43px;right:38px;font-size:12px;letter-spacing:.18em;color:#466b6e;pointer-events:none}

  <main id="scene" aria-label="橘猫骑着薄荷绿电动车在海岸公路上兜风的 3D 动画"></main>
  <header class="topbar">
    <div class="brand"><div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 19V7l7 5h4l7-5v12a9 9 0 0 1-18 0Z" stroke="currentColor" stroke-width="1.5"/><path d="M12 19h.01M20 19h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="m14 23 2 1 2-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="brand-label">猫咪的海岸骑行<span>COASTAL CAT CLUB</span></div></div>
    <div class="badge"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="weather-label">晴天 · 海风轻拂</span></div>
  </header>
  <div class="intro"><p class="eyebrow">A LITTLE COASTAL ESCAPE</p><h1>沿海兜风</h1><p>让海风带路，慢慢骑就好。</p></div>
  <div class="hint"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 8-3 4 3 4m14-8 3 4-3 4M2 12h20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>拖动旋转视角 · 滚轮缩放</span></div>
  <section class="dock" aria-label="动画控制">
    <button class="play" id="play" aria-label="暂停骑行" aria-pressed="false" data-paused="false"><svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg><svg class="resume-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m7 4 14 8-14 8Z"/></svg></button>
    <div class="divider"></div>
    <div class="speed"><label class="speed-label" for="speed">骑行速度<output id="speed-value" for="speed">1.0×</output></label><input id="speed" type="range" min="0.3" max="2" step="0.1" value="1" aria-valuetext="1 倍速度"></div>
    <div class="divider"></div>
    <div class="views" aria-label="镜头视角"><button class="chip" data-view="coast" aria-pressed="true">海岸视角</button><button class="chip" data-view="close" aria-pressed="false">猫咪特写</button><button class="chip" data-view="follow" aria-pressed="false">跟随骑行</button></div>
    <div class="divider"></div>
    <button class="icon-button" id="sunset" aria-label="切换到日落" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 16h18M5 20h14M6 16a6 6 0 0 1 12 0M12 3v3M4 7l2 2m14-2-2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>日落时分</span></button>
    <button class="icon-button fullscreen" id="fullscreen" aria-label="进入全屏"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>全屏欣赏</span></button>
  </section>
  <div class="journey">今日的小旅行<strong><span id="distance">0.00</span> km · 一路向海</strong></div><div class="corner">TAKE THE SLOW ROAD</div>
