<title>河岸邮差 · River Post</title>
<style>
:root{color-scheme:light;--ink:#304b46;--muted:#728078;--paper:#fffdf5;--accent:#b85637;--line:#53645a24}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#e9eee4;color:var(--ink)}button,input{font:inherit}button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #b46d48;outline-offset:5px}#world{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}#world.dragging{cursor:grabbing}.header{position:absolute;top:37px;left:43px;pointer-events:none;transition:opacity .4s}.eyebrow{display:flex;align-items:center;gap:11px;font-size:10px;font-weight:600;letter-spacing:3.4px}.stamp{width:30px;height:30px;border:1px solid #52685b90;border-radius:50%;display:grid;place-items:center}.stamp svg{width:19px;height:19px}.header h1{margin:22px 0 11px;font-family:"STSong","SimSun",serif;font-weight:500;font-size:46px;letter-spacing:9px;line-height:1.2}.header p{font-size:12px;letter-spacing:3px;margin:0;color:#65756b}.header .smallrule{width:34px;height:1px;background:#869886;margin:19px 0}.top-tools{position:absolute;right:37px;top:37px;display:flex;gap:9px;align-items:center}.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:1px solid #ffffffa0;background:#fffdf567;backdrop-filter:blur(16px);border-radius:50%;transition:background .2s,transform .2s}.icon-btn:hover{background:#fffdf5d9;transform:translateY(-2px)}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.time-btn{height:39px;border-radius:23px;padding:0 16px;gap:9px;display:flex;align-items:center;background:#fffdf582;border:1px solid #ffffffb0;font-size:11px;letter-spacing:1px;backdrop-filter:blur(16px)}.time-btn:hover{background:#fffdf5d9}.weather{position:absolute;left:44px;bottom:148px;pointer-events:none;font-size:10px;letter-spacing:2px;line-height:1.9;display:flex;gap:12px;align-items:center;color:#526653}.weather .dot{width:6px;height:6px;border-radius:50%;background:#8f9e64;box-shadow:0 0 0 5px #fff8}.weather em{font-style:normal;font-size:11px;letter-spacing:1px;display:block;color:#788675}.dock-wrap{position:absolute;bottom:29px;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 48px));transition:opacity .4s,transform .4s}.dock{display:flex;align-items:center;gap:20px;padding:15px 21px;border:1px solid #ffffffe0;border-radius:20px;background:#fffdf5df;box-shadow:0 10px 50px #44564513;backdrop-filter:blur(22px)}.play{width:43px;height:43px;flex-shrink:0;display:grid;place-items:center;background:var(--ink);color:#fffdf5;border:0;border-radius:50%;transition:transform .2s,background .2s}.play:hover{background:#476951;transform:scale(1.05)}.separator{height:33px;width:1px;background:var(--line);flex-shrink:0}.pace{min-width:143px;flex:1}.pace-head{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:1px;margin-bottom:7px}.pace-head output{color:var(--accent);font-variant-numeric:tabular-nums;font-size:10px;letter-spacing:0}.pace input{width:100%;height:3px;margin:6px 0;accent-color:#b86543;cursor:pointer;display:block}input[type=range]{-webkit-appearance:none;appearance:none;background:linear-gradient(to right,#b86543 33%,#dce2d7 33%);border-radius:4px}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#b86543;border:2px solid #fffdf5;box-shadow:0 0 0 1px #b8654380}.action{border:0;background:none;display:flex;align-items:center;gap:8px;white-space:nowrap;padding:10px 0;font-size:11px;letter-spacing:1px;transition:color .2s}.action:hover{color:var(--accent)}.action small{font-size:9px;color:#a1a99c;margin-left:1px;border:1px solid #dce2d7;border-radius:4px;padding:1px 4px}.view-btn{min-width:89px}.footer{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1.5px;color:#66775f;margin:13px 8px 0;text-shadow:0 1px 6px #fff}.journey{font-variant-numeric:tabular-nums}.hint{position:absolute;bottom:146px;right:39px;font-size:10px;letter-spacing:1.5px;color:#536b5b;display:flex;align-items:center;gap:8px;pointer-events:none}.hint svg{width:14px;height:14px}.toast{position:absolute;left:50%;bottom:144px;transform:translate(-50%,8px);padding:11px 20px;border:1px solid #ffffffac;border-radius:40px;backdrop-filter:blur(15px);background:#fffdf5dc;font-size:12px;letter-spacing:1px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{position:fixed;inset:0;background:#edf0e7;z-index:10;display:grid;place-items:center;transition:opacity .8s;pointer-events:none}.loading-inner{text-align:center}.loading svg{width:42px;height:42px;stroke:#a9754d;animation:spin 3s linear infinite}.loading p{letter-spacing:5px;font-size:13px;margin-top:24px}.loading small{color:#889281;font-size:10px;letter-spacing:3px}.loading.done{opacity:0}.error{max-width:400px;padding:32px;line-height:1.8}.error h2{font-weight:500}.hidden-ui .header,.hidden-ui .dock-wrap,.hidden-ui .weather,.hidden-ui .hint{opacity:0;pointer-events:none}.hidden-ui .dock-wrap{transform:translate(-50%,15px)}.hidden-ui .top-tools button:not(#clean){display:none}#flash{position:fixed;inset:0;pointer-events:none;background:white;opacity:0;transition:opacity .3s}.credit{position:absolute;right:41px;top:91px;font-size:8px;letter-spacing:2px;color:#7d8e7b;pointer-events:none}.hidden-ui .credit{display:none}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.header{left:23px;top:25px}.header h1{font-size:34px;letter-spacing:6px;margin-top:18px}.header p{font-size:10px;letter-spacing:2px}.header .smallrule{margin:13px 0}.eyebrow{font-size:8px;letter-spacing:2px}.stamp{width:25px;height:25px}.top-tools{right:20px;top:24px;gap:7px}.icon-btn{width:35px;height:35px}.time-btn{padding:0 11px;height:35px;font-size:10px}.time-btn svg{display:none}.credit{right:22px;top:70px;font-size:7px}.dock-wrap{width:calc(100% - 30px);bottom:18px}.dock{gap:13px;padding:13px 15px;border-radius:17px}.pace{min-width:90px}.action{font-size:10px;gap:5px}.action small{display:none}.dock .separator{display:none}.action svg{width:16px;height:16px}.view-btn{min-width:0}.play{width:36px;height:36px}.weather{left:23px;bottom:127px;font-size:9px;letter-spacing:1px}.weather em{font-size:9px}.hint{right:23px;bottom:129px;font-size:9px;letter-spacing:0}.footer{font-size:7px;letter-spacing:1px}.toast{bottom:165px;font-size:10px}.header{pointer-events:none}}@media(max-width:420px){.dock{gap:11px}.action{flex-direction:column;font-size:8px;gap:3px;padding:0}.action svg{width:17px;height:17px}.hint{display:none}.top-tools{gap:5px}.header h1{font-size:30px}.header p{max-width:190px}.pace-head{font-size:9px}.footer span:first-child{letter-spacing:0}}@media(prefers-reduced-motion:reduce){.loading svg{animation:none}}
.header{z-index:1;isolation:isolate}.header::before{content:"";position:absolute;z-index:-1;pointer-events:none;left:-44px;top:-38px;width:410px;height:285px;background:radial-gradient(ellipse at 10% 20%,#edf0e7e8 0%,#edf0e7b0 27%,#edf0e700 73%)}@media(max-width:700px){.header::before{left:-24px;top:-26px;width:290px;height:225px}}
</style>

<body>
<canvas id="world" aria-label="三维河岸场景：戴围巾的水獭骑着自行车运送包裹。拖动可环绕观察，滚轮或双指可缩放。"></canvas>
<header class="header"><div class="eyebrow"><span class="stamp"><svg viewBox="0 0 24 24"><path d="M4 8h16v11H4zM4 8l8 6 8-6M8 5h8M10 2h4"/></svg></span>RIVER POST · No. 01</div><h1>河岸邮差</h1><div class="smallrule"></div><p>小小的心意，慢慢送到。</p></header>
<div class="top-tools"><button id="light" class="time-btn" title="切换晴日与夕照" aria-label="切换到夕照"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></svg><span>午后晴日</span></button><button id="audio" class="icon-btn" aria-label="开启自然声" title="自然声"><svg viewBox="0 0 24 24"><path d="M10 5L5 9H2v6h3l5 4zM15 9l6 6m0-6-6 6"/></svg></button><button id="clean" class="icon-btn" aria-label="隐藏界面" title="沉浸模式 · H"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
<div class="credit">A LITTLE JOURNEY IN 3D</div>
<div class="weather"><span class="dot"></span><div id="weatherText">河风轻轻 · 邮路漫漫<em>沿着水声，再骑一小段。</em></div></div>
<div class="hint"><svg viewBox="0 0 24 24"><path d="M8 12V6a2 2 0 0 1 4 0v5-8a2 2 0 0 1 4 0v9-5a2 2 0 0 1 4 0v8c0 4-3 7-7 7-2 0-4-1-5-3l-4-6c-1-2 1-4 3-2l1 1"/></svg>拖动环绕 · 滚轮缩放</div>
<div class="dock-wrap"><div class="dock"><button id="play" class="play" title="暂停 / 继续 · 空格" aria-label="暂停动画"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" stroke-width="3"/></svg></button><div class="pace"><label class="pace-head" for="speed"><span>骑行节奏</span><output id="speedLabel">悠然 · 1.0×</output></label><input id="speed" type="range" min="0.4" max="2.2" step="0.1" value="1" aria-label="骑行速度"></div><div class="separator"></div><button id="bell" class="action" title="按响车铃 · B"><svg viewBox="0 0 24 24"><path d="M5 16V9a7 7 0 0 1 14 0v7M3 16h18M8 20h8M12 2V1"/></svg>叮铃<small>B</small></button><button id="view" class="action view-btn" title="切换跟骑、近景、全景 · V"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>跟骑视角</span></button><button id="photo" class="action" title="保存当前画面 · P"><svg viewBox="0 0 24 24"><path d="M3 6h5l2-3h4l2 3h5v14H3z"/><circle cx="12" cy="12" r="4"/></svg>留影</button></div><div class="footer"><span>空格 暂停 / 继续 · H 沉浸 · R 复位</span><span class="journey">已骑行 <span id="distance">000</span> m &nbsp; ↗</span></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div id="flash"></div>
<div id="loading" class="loading"><div class="loading-inner"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="3"/><path d="M24 7v14m0 6v14M7 24h14m6 0h14M12 12l10 10m4 4 10 10M12 36l10-10m4-4 10-10"/></svg><p>正在装好今天的包裹</p><small>RIVER POST</small></div></div>
<script>window.addEventListener('error',function(e){var l=document.getElementById('loading');if(l&&!l.classList.contains('done')){l.innerHTML='<div class="error"><h2>这段旅程暂时无法启程</h2><p>请使用支持 WebGL 2 的新版 Edge、Chrome、Firefox 或 Safari，并启用浏览器图形加速。</p><small></small></div>';l.querySelector('small').textContent=e.message;}});</script>

</body>
