<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dceddf">
  <meta name="description" content="一只橘猫、一辆薄荷绿电动车、一条通往海风的路。可离线运行的 Three.js 3D 动画。">
  <title>猫的海岸线 · Coast with me</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23cdebdc'/%3E%3Cpath d='M12 43V13l17 11h6l17-11v30q-20 21-40 0' fill='%23e69a4e'/%3E%3Ccircle cx='24' cy='35' r='3' fill='%23263537'/%3E%3Ccircle cx='41' cy='35' r='3' fill='%23263537'/%3E%3Cpath d='m29 43 4 3 4-3' fill='none' stroke='%23263537' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#234548;background:#a9d9df;font-synthesis:none;--ink:#21494a;--paper:rgba(255,253,240,.88);--line:rgba(40,80,75,.16)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #df7542;outline-offset:4px}button svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#scene:active{cursor:grabbing}
    .brand{position:fixed;top:max(32px,env(safe-area-inset-top));left:40px;pointer-events:none;user-select:none}.eyebrow{font-size:12px;letter-spacing:3.5px;font-weight:600;display:flex;align-items:center;gap:10px}.eyebrow:before{content:"";width:24px;height:1px;background:currentColor}h1{margin:10px 0 9px;font-size:clamp(26px,3.4vw,46px);font-weight:600;letter-spacing:5px;line-height:1.3}.brand p{margin:0;font-size:14px;letter-spacing:2px;opacity:.78}.edition{position:fixed;right:36px;top:36px;display:flex;align-items:center;gap:14px}.stamp{font-size:12px;letter-spacing:2px;border-right:1px solid var(--line);padding-right:16px;text-align:right;line-height:1.8}.icon-button{width:42px;height:42px;border:1px solid rgba(255,255,255,.6);border-radius:50%;background:rgba(255,253,240,.6);display:grid;place-items:center;backdrop-filter:blur(10px);transition:background .2s,transform .2s}.icon-button:hover{background:#fff9e9;transform:translateY(-2px)}
    .readout{position:fixed;left:40px;bottom:140px;pointer-events:none;user-select:none;display:flex;align-items:center;gap:14px;color:#fffdf0;text-shadow:0 1px 10px rgba(22,45,45,.25)}.readout .number{font:300 46px/1 "Segoe UI",sans-serif;letter-spacing:-2px;font-variant-numeric:tabular-nums}.readout small{font-size:12px;letter-spacing:1px}.readout .caption{font-size:12px;letter-spacing:2px;margin-top:6px;opacity:.85}.readout .separator{width:1px;height:32px;background:rgba(255,255,255,.35);margin:0 4px}.journey{font-size:16px;font-variant-numeric:tabular-nums}.mini{font-size:11px;letter-spacing:1px;opacity:.8}
    .controls-wrap{position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 20px}.hint{color:#fffdf2;font-size:12px;letter-spacing:1px;text-shadow:0 1px 7px #264b4b;opacity:.9;pointer-events:none}.controls{display:flex;align-items:center;gap:18px;min-height:68px;padding:11px 18px 11px 12px;border:1px solid rgba(255,255,255,.75);background:var(--paper);border-radius:24px;box-shadow:0 8px 32px rgba(29,61,65,.13);backdrop-filter:blur(18px)}.divider{height:30px;width:1px;background:var(--line)}#play{display:flex;align-items:center;justify-content:center;gap:9px;height:44px;min-width:100px;padding:0 16px;border:0;background:#245d5d;border-radius:15px;color:#fff9ec;font-size:14px;font-weight:600}#play:hover{background:#194748}.cameras{display:flex;gap:3px}.camera{height:40px;padding:0 13px;background:transparent;border:0;border-radius:12px;font-size:14px;white-space:nowrap}.camera[aria-pressed="true"]{background:#d3e6d9;color:#24534e;font-weight:600}.camera:hover{background:#dfede2}.speed{display:flex;align-items:center;gap:10px;font-size:13px;white-space:nowrap}.speed label{opacity:.76}.speed output{width:30px;font-variant-numeric:tabular-nums;font-size:13px}input[type=range]{appearance:none;-webkit-appearance:none;width:86px;height:4px;border-radius:5px;background:#bed1c6;accent-color:#245d5d;cursor:pointer}input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;background:#245d5d;border:3px solid #f9f8eb;border-radius:50%;box-shadow:0 0 0 1px #245d5d}
    #loading,#error{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#d5e9df;padding:30px;text-align:center}#loading{transition:opacity .45s}.loading-mark{font-size:52px;line-height:1;margin-bottom:22px}.loading-text{font-size:17px;letter-spacing:4px}#error{display:none;color:#254c4c}#error p{max-width:460px;line-height:1.8}#error button{padding:10px 20px;border:0;background:#245d5d;color:white;border-radius:10px}#toast{position:fixed;top:120px;left:50%;transform:translate(-50%,-8px);background:#fff9e8;padding:11px 18px;border-radius:30px;box-shadow:0 5px 20px #2c59552a;font-size:13px;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.brand{top:25px;left:24px}h1{font-size:29px;letter-spacing:3px}.brand p{font-size:12px;letter-spacing:1px}.eyebrow{font-size:10px;letter-spacing:2px}.edition{right:20px;top:25px}.stamp{display:none}.controls{gap:10px;border-radius:20px;padding:10px;flex-wrap:wrap;justify-content:center;max-width:460px}.controls-wrap{bottom:20px;gap:10px;padding:0 16px}.camera{font-size:13px;padding:0 10px}#play{min-width:84px;padding:0 12px}.controls>.divider{display:none}.speed{border-top:1px solid var(--line);padding:10px 18px 1px;width:100%;justify-content:center;gap:15px}.speed input{width:145px}.readout{left:24px;bottom:190px}.readout .number{font-size:38px}.hint{font-size:11px}.icon-button{width:38px;height:38px}}
    @media(max-height:510px) and (min-width:600px){.brand{top:20px;left:24px}h1{font-size:27px;margin:5px 0}.brand p,.stamp,.hint{display:none}.edition{top:20px;right:20px}.controls-wrap{bottom:15px}.controls{min-height:58px}.readout{left:24px;bottom:105px}.readout .number{font-size:32px}.speed{border:0;padding:0;width:auto}.controls{flex-wrap:nowrap;max-width:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <canvas id="scene" aria-label="橘猫骑着薄荷绿电动车沿海边公路行驶的三维场景，可拖动旋转视角"></canvas>
  <header class="brand"><div class="eyebrow">COAST WITH ME</div><h1>猫的海岸线</h1><p>海风刚好，慢慢骑。</p></header>
  <aside class="edition"><div class="stamp">SEASIDE RIDE<br>一路向海 · 01</div><button class="icon-button" id="light" title="切换日落光线" aria-label="切换日落光线" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><button class="icon-button" id="fullscreen" title="全屏" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></aside>
  <aside class="readout"><div><span class="number" id="speedometer">24</span> <small>km/h</small><div class="caption" id="ride-state">沿海巡航中</div></div><div class="separator"></div><div><div class="journey"><span id="distance">0.00</span> <span class="mini">km</span></div><div class="caption">今日小旅行</div></div></aside>
  <footer class="controls-wrap"><div class="hint" id="hint">拖动环顾 · 滚轮缩放 · 空格暂停</div><div class="controls"><button id="play" aria-label="暂停骑行" aria-pressed="false"><svg id="play-icon" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span id="play-label">暂停</span></button><span class="divider"></span><div class="cameras" role="group" aria-label="观察视角"><button class="camera" data-camera="coast" aria-pressed="true">沿海跟拍</button><button class="camera" data-camera="close" aria-pressed="false">猫咪特写</button><button class="camera" data-camera="wide" aria-pressed="false">高空漫游</button></div><span class="divider"></span><div class="speed"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.4" max="1.8" step="0.1" value="1" aria-label="骑行速度倍率"><output for="speed" id="speed-label">1.0×</output></div></div></footer>
  <div id="loading"><div class="loading-mark">☀</div><div class="loading-text">海风正在赶来</div></div>
  <div id="error" role="alert"><h2>这次海岸旅行还没能出发</h2><p id="error-message">浏览器未能启动 3D 画面。请使用开启硬件加速的新版 Chrome 或 Edge 浏览器打开此文件。</p><button onclick="location.reload()">重新出发</button></div>
  <div id="toast" role="status"></div>
  <script>window.addEventListener('error',function(e){document.getElementById('loading').style.display='none';document.getElementById('error').style.display='flex';console.error('Scene error:',e.message)});</script>
  <!-- All scene code, Three.js, geometry and textures are embedded. No network requests are needed. -->
  <script>/*__BUNDLE__*/</script>
</body>
</html>
